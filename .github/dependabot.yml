version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # concaveman 2.x is ESM-only; js/convex-hull.js uses require()
      - dependency-name: "concaveman"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/py"
    schedule:
      interval: "monthly"
